name: Market index

# Regenerates the plugin index that DSH-Portable pre-installs into the official experimental plugin market, and
# publishes it as the only file of the force-pushed `market-index` branch. A raw.githubusercontent.com URL answers
# without a redirect, which the official market requires of an index, and a single-commit branch keeps the repository
# from growing by several megabytes a day. The previous index stays in place unless every check below passes.

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Generator tests
        run: node --test tests/market-index.test.mjs
      - name: Build the index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-market-index.mjs awesome-index.json --report market-index-report.json
      - name: Validate with the official parser, including the Portable tarball source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/WSL043/DSH-Portable.git "$RUNNER_TEMP/portable"
          mkdir -p "$RUNNER_TEMP/validate" && cd "$RUNNER_TEMP/validate"
          npm init -y >/dev/null
          npm i --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh-plugin-market-index@next @deepseek-ai/dsh-client-ui-plugin-market@next semver >/dev/null
          node "$RUNNER_TEMP/portable/scripts/patch-official-market-tarball.mjs" "$PWD"
          cat > validate.mjs <<'NODE'
          import { readFileSync } from 'node:fs'
          import { parseMarketIndex } from '@deepseek-ai/dsh-plugin-market-index'
          const index = JSON.parse(readFileSync(process.argv[2], 'utf8'))
          const parsed = parseMarketIndex(index, 'https://raw.githubusercontent.com/WSL043/DSH-Portable-Updates/market-index/awesome-index.json')
          if (parsed.plugins.length !== index.plugins.length) throw new Error('the official parser dropped entries')
          console.log(`official parser accepts ${parsed.plugins.length} plugins`)
          NODE
          node validate.mjs "$GITHUB_WORKSPACE/awesome-index.json"
      - name: Refuse a shrunken catalog
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const next = JSON.parse(readFileSync('awesome-index.json', 'utf8')).plugins.length
          const response = await fetch('https://raw.githubusercontent.com/WSL043/DSH-Portable-Updates/market-index/awesome-index.json')
          if (response.ok) {
            const previous = (await response.json()).plugins.length
            if (next < previous * 0.85) throw new Error(`the new index has ${next} plugins, the published one ${previous}; refusing to replace it`)
            console.log(`previous ${previous}, new ${next}`)
          } else console.log(`no previous index (HTTP ${response.status}); publishing the first one`)
          NODE
      - name: Publish
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/publish"
          cp awesome-index.json market-index-report.json "$RUNNER_TEMP/publish/"
          printf '# Awesome DSH index for DSH-Portable\n\nGenerated daily by the `Market index` workflow from https://awesome-dsh-plugin.com/plugins.json. Do not edit.\n' > "$RUNNER_TEMP/publish/README.md"
          cd "$RUNNER_TEMP/publish"
          git init -q -b market-index
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -q -m "Awesome DSH index $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" market-index
