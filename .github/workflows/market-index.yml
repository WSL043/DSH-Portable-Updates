name: Market index

# Regenerates the plugin index that DSH-Portable pre-installs into the official experimental plugin market, and
# publishes it on the force-pushed `market-index` branch, served to clients through the jsDelivr CDN without redirects.
# A single-commit branch keeps the repository from growing by several megabytes a day. The previous index stays in
# place unless every pre-publication check below passes. CDN readback then verifies the exact validated bytes.

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Generator tests
        run: node --test tests/market-index.test.mjs
      - name: Build the index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-market-index.mjs awesome-index.json --report market-index-report.json
      - name: Validate with unmodified official RC and alpha parsers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/validate" && cd "$RUNNER_TEMP/validate"
          npm init -y >/dev/null
          npm i --ignore-scripts --no-audit --no-fund dsh-market-index-rc5@npm:@deepseek-ai/dsh-plugin-market-index@0.2.1-rc.5 dsh-market-index-alpha3@npm:@deepseek-ai/dsh-plugin-market-index@0.2.2-alpha.3 >/dev/null
          cat > validate.mjs <<'NODE'
          import { readFileSync } from 'node:fs'
          const bytes = readFileSync(process.argv[2])
          const index = JSON.parse(bytes)
          const url = 'https://cdn.jsdelivr.net/gh/WSL043/DSH-Portable-Updates@market-index/awesome-index.json'
          for (const name of ['dsh-market-index-rc5', 'dsh-market-index-alpha3']) {
            const { parseMarketIndex } = await import(name)
            const parsed = parseMarketIndex(index, url)
            if (parsed.plugins.length !== index.plugins.length) throw new Error('the official parser dropped entries')
            console.log(`${name} accepts ${parsed.plugins.length} plugins`)
          }
          if (process.argv.includes('--cdn')) {
            const purge = await fetch(url.replace('cdn.jsdelivr.net', 'purge.jsdelivr.net'), { signal: AbortSignal.timeout(15000) })
            if (!purge.ok) throw new Error(`CDN purge returned HTTP ${purge.status}`)
            await purge.json()
            for (let attempt = 0; ; attempt++) {
              const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(15000) })
              if (response.ok && Buffer.from(await response.arrayBuffer()).equals(bytes)) break
              if (!response.ok) await response.body?.cancel()
              if (attempt === 5) throw new Error('CDN does not serve the validated index')
              await new Promise(resolve => setTimeout(resolve, 5000))
            }
            console.log('CDN serves the exact index accepted by both official parsers')
          }
          NODE
          node validate.mjs "$GITHUB_WORKSPACE/awesome-index.json"
      - name: Refuse a shrunken catalog
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const next = JSON.parse(readFileSync('awesome-index.json', 'utf8')).plugins.length
          const response = await fetch('https://raw.githubusercontent.com/WSL043/DSH-Portable-Updates/market-index/awesome-index.json')
          if (response.ok) {
            const previous = (await response.json()).plugins.length
            if (next < previous * 0.85) throw new Error(`the new index has ${next} plugins, the published one ${previous}; refusing to replace it`)
            console.log(`previous ${previous}, new ${next}`)
          } else console.log(`no previous index (HTTP ${response.status}); publishing the first one`)
          NODE
      - name: Publish
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/publish"
          cp awesome-index.json market-index-report.json "$RUNNER_TEMP/publish/"
          printf '# Awesome DSH index for DSH-Portable\n\nGenerated daily by the `Market index` workflow from https://awesome-dsh-plugin.com/plugins.json. Do not edit.\n' > "$RUNNER_TEMP/publish/README.md"
          cd "$RUNNER_TEMP/publish"
          git init -q -b market-index
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -q -m "Awesome DSH index $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" market-index
      - name: Refresh and verify the public CDN index
        run: node "$RUNNER_TEMP/validate/validate.mjs" "$GITHUB_WORKSPACE/awesome-index.json" --cdn
