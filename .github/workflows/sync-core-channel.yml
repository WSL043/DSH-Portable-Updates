name: Qualify one DSH core against the latest Native Portable shell

on:
  workflow_call:
    outputs:
      attempted:
        description: Whether a core was selected for qualification in this run
        value: ${{ jobs.resolve.outputs.attempted }}
    inputs:
      accepted_only:
        description: Requalify the already accepted core without upstream version discovery
        required: false
        type: boolean
        default: false
      rebuild:
        description: Rebuild the accepted core even when its dependency fingerprint is unchanged
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: verified-core-single-lane
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      attempted: ${{ steps.discovery.outputs.publish }}
      publish: ${{ steps.selection.outputs.publish }}
      version: ${{ steps.selection.outputs.version }}
      selection_status: ${{ steps.selection.outputs.status }}
      selection_reason: ${{ steps.selection.outputs.reason }}
      state_tag: ${{ steps.source.outputs.state_tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      plugin_status: ${{ steps.plugin-preflight.outputs.status }}
      run_id: ${{ steps.source.outputs.run_id }}
      lock_file: ${{ steps.source.outputs.lock_file }}
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
      top_three: ${{ steps.selection.outputs.top_three }}
      qualified_versions: ${{ steps.selection.outputs.qualified_versions }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: update-channel
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Initialize selection record
        run: |
          set -euo pipefail
          printf '{"schemaVersion":1,"sourceSha":null,"version":null,"publish":false,"status":"unresolved","attemptedAt":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > selection.json
      - name: Resolve a published and qualified Portable baseline
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOCK_FILE=upstream.lock.json

          gh api 'repos/WSL043/DSH-Portable/releases?per_page=100' > published-releases.json
          RELEASE_JSON="$(node update-channel/scripts/select-native-release.mjs published-releases.json)"
          RELEASE_TAG="$(jq -r '.tag_name // empty' <<<"$RELEASE_JSON")"
          test -n "$RELEASE_TAG"
          UPDATE_TAG=update-channel-core
          echo "state_tag=$UPDATE_TAG" >> "$GITHUB_OUTPUT"
          TAG_REF="$(gh api "repos/WSL043/DSH-Portable/git/ref/tags/$RELEASE_TAG")"
          TAG_TYPE="$(jq -r '.object.type // empty' <<<"$TAG_REF")"
          TAG_SHA="$(jq -r '.object.sha // empty' <<<"$TAG_REF")"
          case "$TAG_TYPE" in
            commit) SOURCE_SHA="$TAG_SHA" ;;
            tag)
              TAG_OBJECT="$(gh api "repos/WSL043/DSH-Portable/git/tags/$TAG_SHA")"
              test "$(jq -r '.object.type // empty' <<<"$TAG_OBJECT")" = commit
              SOURCE_SHA="$(jq -r '.object.sha // empty' <<<"$TAG_OBJECT")"
              ;;
            *) echo "Stable release tag does not resolve to a commit: $RELEASE_TAG ($TAG_TYPE)" >&2; exit 1 ;;
          esac
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

          CI_RUNS="$(gh api "repos/WSL043/DSH-Portable/actions/workflows/ci.yml/runs?status=success&branch=main&head_sha=$SOURCE_SHA&per_page=100")"
          SOURCE_RUN_ID="$(jq -r '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | first | .id // empty' <<<"$CI_RUNS")"
          test -n "$SOURCE_SHA" && test "$SOURCE_SHA" != null
          test -n "$SOURCE_RUN_ID" && test "$SOURCE_RUN_ID" != null
          SOURCE_VERSION="$(curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/WSL043/DSH-Portable/$SOURCE_SHA/package.json" | jq -r .version)"
          [[ "$SOURCE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          test "v$SOURCE_VERSION" = "$RELEASE_TAG"

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "lock_file=$LOCK_FILE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_version=$SOURCE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: WSL043/DSH-Portable
          ref: ${{ steps.source.outputs.source_sha }}
          path: portable-source
      - name: Discover and lock the newest official core release
        id: discovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          PIPELINE_SHA: ${{ github.sha }}
          ACCEPTED_CORE_ONLY: ${{ inputs.accepted_only || false }}
          REBUILD_CORE: ${{ inputs.rebuild || false }}
        run: |
          set -euo pipefail
          node --test update-channel/tests/*.test.mjs
          node update-channel/scripts/discover-core-source.mjs portable-source resolved-core/lock.json selection.json qualification-state.json
          echo "commit=$(jq -r '.dsh.reviewedCommit' resolved-core/lock.json)" >> "$GITHUB_OUTPUT"
          echo "publish=$(jq -r '.publish' selection.json)" >> "$GITHUB_OUTPUT"
          echo "top_three=$(jq -c '.topThree' selection.json)" >> "$GITHUB_OUTPUT"
      - name: Install the published product's pinned semver verifier
        if: steps.discovery.outputs.publish == 'true'
        run: npm ci --prefix portable-source/app --ignore-scripts --no-audit --no-fund
      - name: Block incompatible default plugins before source build
        if: steps.discovery.outputs.publish == 'true'
        id: plugin-preflight
        run: node update-channel/scripts/preflight-adapters.mjs --default-peers-only portable-source resolved-core/lock.json > preflight.json
      - name: Record a compatibility hold without starting a build
        if: steps.plugin-preflight.outputs.status == 'blocked'
        run: |
          jq --slurpfile hold preflight.json '.publish = false | .status = "blocked" | .adapter = $hold[0].adapter | .reason = $hold[0].reason' selection.json > selection.tmp.json
          mv selection.tmp.json selection.json
      - uses: actions/checkout@v7
        if: steps.discovery.outputs.publish == 'true' && steps.plugin-preflight.outputs.status == 'success'
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.discovery.outputs.commit }}
          path: official-plan
      - name: Resolve the official publishable package membership
        id: plan
        if: steps.discovery.outputs.publish == 'true' && steps.plugin-preflight.outputs.status == 'success'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          node update-channel/scripts/resolve-packed-members.mjs official-plan resolved-core/lock.json
          FINGERPRINT="$(
            {
              printf '%s\0' "$SOURCE_SHA"
              cat resolved-core/lock.json portable-source/app/package-lock.json
            } | sha256sum | cut -d' ' -f1
          )"

          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resolved-selection
          path: selection.json
          if-no-files-found: warn
      - name: Expose selection
        id: selection
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f selection.json ]]; then
            jq -r '"version=" + (.version // ""), "publish=" + ((.publish // false) | tostring), "status=" + (.status // "unknown"), "reason=" + ((.reason // "") | gsub("[\r\n]"; " ") | .[0:400]), "top_three=" + ((.topThree // []) | tojson), "qualified_versions=" + ((.qualifiedVersions // []) | tojson)' selection.json >> "$GITHUB_OUTPUT"
          else
            printf 'version=\npublish=false\nstatus=unresolved\nreason=\ntop_three=[]\nqualified_versions=[]\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resolved-core
          path: resolved-core/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resolved-state
          path: qualification-state.json
          if-no-files-found: warn

  preview-runtime:
    needs: resolve
    if: needs.resolve.result == 'success' && needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      adapter_status: ${{ steps.adapter-preflight.outputs.status || steps.descriptor-v2.outputs.status }}
      adapter_reason: ${{ steps.descriptor-v2.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: WSL043/DSH-Portable
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: resolved-core
          path: resolved-core
      - name: Apply the exact discovered official source lock
        shell: bash
        env:
          LOCK_FILE: ${{ needs.resolve.outputs.lock_file }}
        run: cp resolved-core/lock.json "$LOCK_FILE"
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Resolve the locked official source
        id: preview
        env:
          LOCK_FILE: ${{ needs.resolve.outputs.lock_file }}
        run: |
          node -e "const fs=require('fs'); const lock=JSON.parse(fs.readFileSync(process.env.LOCK_FILE,'utf8')); console.log('commit='+lock.dsh.reviewedCommit); console.log('packageManager='+lock.dsh.packageManager); for (const family of ['dsh','vendor','landlock']) { const count=lock.dsh.packedFamilies?.[family]; if (!Number.isInteger(count)) throw new Error('Missing packedFamilies.'+family); console.log(family+'Count='+count) }" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.preview.outputs.commit }}
          path: upstream
      - name: Build and pack the locked official preview source
        run: |
          test "$(git -C upstream rev-parse HEAD)" = '${{ steps.preview.outputs.commit }}'
          npm install --global '${{ steps.preview.outputs.packageManager }}'
          pnpm --dir upstream install --frozen-lockfile
          pnpm --dir upstream run build:official
          pnpm --dir upstream run release:pack --family dsh --out dist/npm --concurrency 8
          pnpm --dir upstream run release:pack --family vendor --out dist/npm-vendor --concurrency 8
          case "${{ steps.preview.outputs.landlockCount }}" in
            0) mkdir -p upstream/dist/npm-landlock ;;
            1)
              mkdir -p upstream/dist/npm-landlock
              pnpm --dir upstream/native/landlock-run/packages/entry pack --pack-destination "$PWD/upstream/dist/npm-landlock"
              ;;
            *) echo "Unsupported landlock package count: ${{ steps.preview.outputs.landlockCount }}" >&2; exit 1 ;;
          esac
          test "$(find upstream/dist/npm -maxdepth 1 -name '*.tgz' | wc -l)" -eq "${{ steps.preview.outputs.dshCount }}"
          test "$(find upstream/dist/npm-vendor -maxdepth 1 -name '*.tgz' | wc -l)" -eq "${{ steps.preview.outputs.vendorCount }}"
          test "$(find upstream/dist/npm-landlock -maxdepth 1 -name '*.tgz' | wc -l)" -eq "${{ steps.preview.outputs.landlockCount }}"
      - uses: actions/checkout@v7
        with:
          path: update-channel
      - name: Prepare adapter preflight against the published Portable baseline
        run: |
          node update-channel/scripts/bind-market-host.mjs . resolved-core/members.json
          node scripts/stage-preview-runtime.mjs --packed-root upstream/dist --output preflight-app --lock-file '${{ needs.resolve.outputs.lock_file }}'
      - name: Verify released descriptor-v2 migration against the exact packaged core
        id: descriptor-v2
        continue-on-error: true
        run: |
          # Match the selected published product's packaging sequence. Its
          # adapter is version- and digest-bound; newer cores remain unmodified.
          if test -f scripts/patch-historical-descriptor.mjs; then
            node scripts/patch-historical-descriptor.mjs preflight-app
          fi
          node update-channel/scripts/verify-descriptor-v2-migration.mjs preflight-app
      - name: Stop before platform builds when descriptor-v2 cannot be restored
        if: always() && steps.descriptor-v2.outcome == 'failure'
        run: exit 1
      - name: Reject incompatible adapters before platform fan-out
        id: adapter-preflight
        run: node update-channel/scripts/preflight-adapters.mjs . preflight-app resolved-core/lock.json
      - uses: actions/upload-artifact@v7
        with:
          name: preview-packed-stable
          path: |
            upstream/dist/npm
            upstream/dist/npm-vendor
            upstream/dist/npm-landlock
          if-no-files-found: error
          compression-level: 0

  build:
    needs: [resolve, preview-runtime]
    if: needs.resolve.result == 'success' && needs.preview-runtime.result == 'success' && needs.resolve.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x64
            artifact: windows-x64
          - runner: macos-15
            platform: macos
            arch: arm64
            artifact: macos-arm64
          - runner: macos-15-intel
            platform: macos
            arch: x64
            artifact: macos-x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            artifact: linux-x64
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: WSL043/DSH-Portable
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: resolved-core
          path: resolved-core
      - name: Apply the exact discovered official source lock
        shell: bash
        env:
          LOCK_FILE: ${{ needs.resolve.outputs.lock_file }}
        run: cp resolved-core/lock.json "$LOCK_FILE"
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}-build
          repository: WSL043/DSH-Portable
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
          path: baseline-artifacts
      - uses: actions/download-artifact@v8
        with:
          name: preview-packed-stable
          path: preview-packed
      - uses: actions/checkout@v7
        with:
          path: update-channel
      - name: Bind our market to the exact host being qualified
        run: node update-channel/scripts/bind-market-host.mjs . resolved-core/members.json
      - name: Align runtime verification with the published permission adapter
        run: node update-channel/scripts/adapt-runtime-verifier.mjs .
      - name: Stage the exact verified preview runtime (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          & node scripts/stage-preview-runtime.mjs `
            --packed-root preview-packed `
            --output preview-app `
            --lock-file '${{ needs.resolve.outputs.lock_file }}'
          if ($LASTEXITCODE -ne 0) { throw "Windows preview runtime staging failed with exit code $LASTEXITCODE" }
      - name: Stage the exact verified preview runtime (Unix)
        if: matrix.platform != 'windows'
        run: node scripts/stage-preview-runtime.mjs --packed-root preview-packed --output preview-app --lock-file '${{ needs.resolve.outputs.lock_file }}'
      - uses: dtolnay/rust-toolchain@1.88.0
        if: matrix.platform == 'linux'
        with:
          components: rustfmt
      - name: Install pinned Linux desktop build dependencies
        if: matrix.platform == 'linux'
        run: |
          bash scripts/install-linux-packages.sh \
            build-essential curl file fuse libayatana-appindicator3-dev libfuse2 \
            libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf \
            unzip xauth xvfb xdotool zip
      - name: Build Windows core component
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          & ./scripts/build-windows.ps1 -PreviewAppSource preview-app -CoreOnly -CoreChannel 'stable'
          if ($LASTEXITCODE -ne 0) { throw "Windows core build failed with exit code $LASTEXITCODE" }
      - name: Build macOS core component
        if: matrix.platform == 'macos'
        env:
          PREVIEW_APP_SOURCE: ${{ github.workspace }}/preview-app
          DSH_PORTABLE_CORE_ONLY: '1'
          DSH_PORTABLE_CORE_CHANNEL: stable
        run: |
          bash scripts/build-macos.sh "${{ matrix.arch }}"
      - name: Build Linux core component
        if: matrix.platform == 'linux'
        env:
          PREVIEW_APP_SOURCE: ${{ github.workspace }}/preview-app
          DSH_PORTABLE_CORE_ONLY: '1'
          DSH_PORTABLE_CORE_CHANNEL: stable
        run: |
          bash scripts/build-linux.sh "${{ matrix.arch }}"
      - name: Verify and smoke the core update on the exact base product
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          & node scripts/verify-update-artifact.mjs `
            "artifacts/dsh-core-update-${{ matrix.artifact }}.json" `
            "artifacts/DSH-Portable-update-${{ matrix.artifact }}.zip" engine
          if ($LASTEXITCODE -ne 0) { throw "Windows core artifact verification failed with exit code $LASTEXITCODE" }
          $AcceptanceRoot = Join-Path $env:RUNNER_TEMP 'core-acceptance'
          New-Item -ItemType Directory -Path $AcceptanceRoot | Out-Null
          & tar.exe -x -f (Join-Path $env:GITHUB_WORKSPACE 'baseline-artifacts\DSH-Portable-windows-x64-offline.zip') -C $AcceptanceRoot
          if ($LASTEXITCODE -ne 0) { throw "Windows base archive extraction failed with exit code $LASTEXITCODE" }
          $BaselineRoot = Join-Path $AcceptanceRoot 'DSH-Portable'
          if (-not (Test-Path -LiteralPath $BaselineRoot -PathType Container)) { throw "Windows base root is missing: $BaselineRoot" }
          & node scripts/smoke-update-artifact.mjs `
            $BaselineRoot `
            "artifacts/dsh-core-update-${{ matrix.artifact }}.json" `
            "artifacts/DSH-Portable-update-${{ matrix.artifact }}.zip"
          if ($LASTEXITCODE -ne 0) { throw "Windows core update smoke failed with exit code $LASTEXITCODE" }
          & node scripts/smoke-windows-subprocess-hide.mjs $BaselineRoot
          if ($LASTEXITCODE -ne 0) { throw 'Windows core subprocess visibility smoke failed.' }
          & node scripts/smoke-windows-startup-theme.mjs $BaselineRoot --disposable
          if ($LASTEXITCODE -ne 0) { throw 'Windows core startup and theme smoke failed.' }
      - name: Exercise default plugins in the updated native Windows product
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $DriverRoot = Join-Path $env:RUNNER_TEMP 'core-ui-driver'
          & npm install --prefix $DriverRoot --ignore-scripts --no-audit --no-fund playwright@1.63.0
          if ($LASTEXITCODE -ne 0) { throw 'Native plugin UI driver installation failed.' }
          $BaselineRoot = Join-Path $env:RUNNER_TEMP 'core-acceptance/DSH-Portable'
          & node update-channel/scripts/verify-default-plugin-ui.mjs $BaselineRoot (Join-Path $DriverRoot 'package.json') --disposable
          if ($LASTEXITCODE -ne 0) { throw 'Default plugin native UI qualification failed; core publication is blocked.' }
      - name: Verify and smoke the core update on the exact base product
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          node scripts/verify-update-artifact.mjs \
            "artifacts/dsh-core-update-${{ matrix.artifact }}.json" \
            "artifacts/DSH-Portable-update-${{ matrix.artifact }}.zip" engine
          ACCEPTANCE_ROOT="$RUNNER_TEMP/core-acceptance"
          mkdir "$ACCEPTANCE_ROOT"
          ditto -x -k "baseline-artifacts/DSH-Portable-macos-${{ matrix.arch }}.zip" "$ACCEPTANCE_ROOT"
          BASELINE_ROOT="$ACCEPTANCE_ROOT/DSH-Portable"
          test -d "$BASELINE_ROOT"
          node scripts/smoke-update-artifact.mjs \
            "$BASELINE_ROOT" \
            "artifacts/dsh-core-update-${{ matrix.artifact }}.json" \
            "artifacts/DSH-Portable-update-${{ matrix.artifact }}.zip"
      - name: Verify and smoke the core update on the exact base product
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          node scripts/verify-update-artifact.mjs \
            "artifacts/dsh-core-update-${{ matrix.artifact }}.json" \
            "artifacts/DSH-Portable-update-${{ matrix.artifact }}.zip" engine
          ACCEPTANCE_ROOT="$RUNNER_TEMP/core-acceptance"
          mkdir "$ACCEPTANCE_ROOT"
          tar -xzf "baseline-artifacts/DSH-Portable-linux-${{ matrix.arch }}.tar.gz" -C "$ACCEPTANCE_ROOT"
          BASELINE_ROOT="$ACCEPTANCE_ROOT/DSH-Portable"
          test -d "$BASELINE_ROOT"
          node scripts/smoke-update-artifact.mjs \
            "$BASELINE_ROOT" \
            "artifacts/dsh-core-update-${{ matrix.artifact }}.json" \
            "artifacts/DSH-Portable-update-${{ matrix.artifact }}.zip"
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: core-stable-${{ matrix.artifact }}
          path: |
            artifacts/DSH-Portable-update-${{ matrix.artifact }}.zip
            artifacts/dsh-core-update-${{ matrix.artifact }}.json
          if-no-files-found: error
          compression-level: 0
      - name: Upload baseline update diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-diagnostics-stable-${{ matrix.artifact }}
          path: |
            market-host-binding.json
            ${{ runner.temp }}/core-acceptance/DSH-Portable/data/logs
            ${{ runner.temp }}/core-acceptance/DSH-Portable/data/dsh-home/profiles/web/package.json
            ${{ runner.temp }}/core-acceptance/DSH-Portable/acceptance
          if-no-files-found: warn
          compression-level: 0

  publish:
    needs: [resolve, build]
    if: needs.resolve.result == 'success' && needs.resolve.outputs.publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: WSL043/DSH-Portable
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: resolved-core
          path: resolved-core
      - name: Apply the exact discovered official source lock
        shell: bash
        env:
          LOCK_FILE: ${{ needs.resolve.outputs.lock_file }}
        run: cp resolved-core/lock.json "$LOCK_FILE"
      - uses: actions/checkout@v7
        with:
          repository: WSL043/DSH-Portable-Updates
          ref: main
          path: update-channel
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Test the bounded core-version catalog builder
        run: node --test update-channel/tests/*.test.mjs
      - uses: actions/download-artifact@v8
        with:
          pattern: core-stable-*
          merge-multiple: true
          path: artifacts
      - name: Verify once and prepare stable and candidate legacy envelopes
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          FINGERPRINT: ${{ needs.resolve.outputs.fingerprint }}
          SELECTED_VERSION: ${{ needs.resolve.outputs.version }}
          TOP_THREE: ${{ needs.resolve.outputs.top_three }}
          QUALIFIED_VERSIONS: ${{ needs.resolve.outputs.qualified_versions }}
        run: |
          set -euo pipefail
          test -n "$SELECTED_VERSION"
          [[ "$(jq 'length' <<<"$TOP_THREE")" = 3 ]]
          INDEX_QUALIFIED="$(jq -cn --argjson qualified "$QUALIFIED_VERSIONS" --arg version "$SELECTED_VERSION" '$qualified + [$version] | unique')"
          mkdir -p publish previous current
          for channel in stable candidate; do
            mkdir -p "publish/$channel" "previous/$channel" "current/$channel"
            tag="update-channel-core-$channel"
            for platform in windows-x64 macos-arm64 macos-x64 linux-x64 linux-arm64; do
              for asset in "dsh-core-index-${platform}.json" "dsh-core-update-${platform}.json"; do
                curl --fail --silent --show-error --location \
                  "https://github.com/WSL043/DSH-Portable-Updates/releases/download/$tag/$asset" \
                  --output "previous/$channel/$asset" || rm -f "previous/$channel/$asset"
              done
            done
          done
          for platform in windows-x64 macos-arm64 macos-x64 linux-x64 linux-arm64; do
            MANIFEST="artifacts/dsh-core-update-${platform}.json"
            ZIP="artifacts/DSH-Portable-update-${platform}.zip"
            node scripts/verify-update-artifact.mjs "$MANIFEST" "$ZIP" engine
            HASH="$(sha256sum "$ZIP" | cut -d' ' -f1)"
            VERSION="$(jq -jr '.component.dshVersion' "$MANIFEST" | tr -c 'A-Za-z0-9._-' '-')"
            test "$VERSION" = "$SELECTED_VERSION"
            PUBLISHED_ZIP="DSH-Portable-update-${platform}-${VERSION}-${HASH:0:12}.zip"
            for channel in stable candidate; do
              tag="update-channel-core-$channel"
              other=stable
              [[ "$channel" = stable ]] && other=candidate
              PREVIOUS="previous/$channel/dsh-core-update-${platform}.json"
              PREVIOUS_INDEX="previous/$channel/dsh-core-index-${platform}.json"
              OTHER_INDEX="previous/$other/dsh-core-index-${platform}.json"
              URL="https://github.com/WSL043/DSH-Portable-Updates/releases/download/$tag/$PUBLISHED_ZIP"
              jq --arg url "$URL" '.component.urls = [$url] | .releaseChannel = "stable"' "$MANIFEST" \
                > "current/$channel/dsh-core-update-${platform}.json"
              cp "$ZIP" "publish/$channel/$PUBLISHED_ZIP"
              node update-channel/scripts/build-core-index.mjs \
                "$channel" "$platform" "current/$channel/dsh-core-update-${platform}.json" \
                "$PREVIOUS_INDEX" "$PREVIOUS" "publish/$channel" "$TOP_THREE" "$INDEX_QUALIFIED" "$OTHER_INDEX"
            done
          done
          for channel in stable candidate; do
            cp resolved-core/lock.json "publish/$channel/official-core-${SELECTED_VERSION}.lock.json"
            cp resolved-core/lock.json "publish/$channel/official-core.lock.json"
            jq -n \
              --arg channel "$channel" \
              --arg version "$SELECTED_VERSION" \
              --arg sourceSha "$SOURCE_SHA" \
              --arg fingerprint "$FINGERPRINT" \
              --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{schemaVersion:1, channel:$channel, version:$version, sourceRepository:"WSL043/DSH-Portable", sourceSha:$sourceSha, fingerprint:$fingerprint, publishedAt:$publishedAt}' \
              > "publish/$channel/qualification-source-${SELECTED_VERSION}.json"
            cp "publish/$channel/qualification-source-${SELECTED_VERSION}.json" "publish/$channel/channel-source.json"
          done
      - name: Publish archives first and manifests last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for channel in stable candidate; do
            TAG="update-channel-core-$channel"
            gh release view "$TAG" --repo WSL043/DSH-Portable-Updates >/dev/null 2>&1 || \
              gh release create "$TAG" --repo WSL043/DSH-Portable-Updates --target main --prerelease \
                --title "Verified DeepSeek Harness core $channel channel" \
                --notes "Legacy-compatible mirror of the single verified DSH core catalog."
            gh release upload "$TAG" --repo WSL043/DSH-Portable-Updates "publish/$channel"/*.zip --clobber
            gh release upload "$TAG" --repo WSL043/DSH-Portable-Updates \
              "publish/$channel"/dsh-core-update-*.json "publish/$channel"/dsh-core-index-*.json \
              "publish/$channel"/channel-source.json "publish/$channel"/official-core.lock.json \
              "publish/$channel"/official-core-*.lock.json "publish/$channel"/qualification-source-*.json --clobber
          done
      - name: Keep only archives and manifests referenced by each top-three catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for channel in stable candidate; do
            KEEP="$(mktemp)"
            for catalog in "publish/$channel"/dsh-core-index-*.json; do
              jq -r '.versions[].manifest.component.urls[]? | split("/")[-1]' "$catalog" >> "$KEEP"
              jq -r '.versions[].manifestUrl | split("/")[-1]' "$catalog" >> "$KEEP"
            done
            sort -u "$KEEP" -o "$KEEP"
            TAG="update-channel-core-$channel"
            RELEASE_ID="$(gh api "repos/WSL043/DSH-Portable-Updates/releases/tags/$TAG" --jq .id)"
            gh api "repos/WSL043/DSH-Portable-Updates/releases/$RELEASE_ID/assets?per_page=100" \
              --paginate --jq '.[] | [.id,.name] | @tsv' | while IFS=$'\t' read -r id name; do
                case "$name" in
                  *.zip) grep -Fxq "$name" "$KEEP" || gh api -X DELETE "repos/WSL043/DSH-Portable-Updates/releases/assets/$id" ;;
                  dsh-core-update-windows-x64-[0-9]*.json|dsh-core-update-macos-arm64-[0-9]*.json|dsh-core-update-macos-x64-[0-9]*.json|dsh-core-update-linux-x64-[0-9]*.json|dsh-core-update-linux-arm64-[0-9]*.json)
                    grep -Fxq "$name" "$KEEP" || gh api -X DELETE "repos/WSL043/DSH-Portable-Updates/releases/assets/$id" ;;
                esac
              done
          done

  channel-result:
    needs: [resolve, preview-runtime, build, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Report channel delivery separately from historical backfill
        env:
          CHANNEL: stable
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          SELECTED: ${{ needs.resolve.outputs.publish }}
          CORE_TAG: ${{ needs.resolve.outputs.state_tag }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          PREFLIGHT_RESULT: ${{ needs.preview-runtime.outputs.adapter_status || needs.resolve.outputs.plugin_status }}
          HOLD_REASON: ${{ needs.preview-runtime.outputs.adapter_reason || needs.resolve.outputs.selection_reason }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: node scripts/report-core-result.mjs

  qualification-state:
    env:
      STATE_TAG: ${{ needs.resolve.outputs.state_tag }}
    needs: [resolve, preview-runtime, build, publish]
    if: always() && needs.resolve.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: update-channel
      - uses: actions/download-artifact@v8
        if: always()
        with:
          name: resolved-selection
          path: selection
      - uses: actions/download-artifact@v8
        with:
          name: resolved-state
          path: selection
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Record the qualification result with a retry cooldown
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          PREVIEW_RESULT: ${{ needs.preview-runtime.result }}
          ADAPTER_STATUS: ${{ needs.preview-runtime.outputs.adapter_status }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PUBLISH_REQUIRED: ${{ needs.resolve.outputs.publish }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          PIPELINE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p state
          if [[ -f selection/selection.json ]]; then
            cp selection/selection.json state/selection.json
          else
            printf '{"version":"%s","sourceSha":"%s","attemptedAt":"%s"}\n' \
              "$RESOLVED_VERSION" "$RESOLVED_SOURCE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > state/selection.json
          fi
          cp selection/qualification-state.json state/qualification-state.json
          VERSION="$(jq -r '.version // empty' state/selection.json)"
          [[ -n "$VERSION" ]] || exit 0
          SOURCE_SHA="$(jq -r '.sourceSha // empty' state/selection.json)"
          SOURCE_SHA="${SOURCE_SHA:-$RESOLVED_SOURCE_SHA}"
          ATTEMPTED_AT="$(jq -r '.attemptedAt // empty' state/selection.json)"
          ATTEMPTED_AT="${ATTEMPTED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          if [[ "$ADAPTER_STATUS" = blocked || "${{ needs.resolve.outputs.plugin_status }}" = blocked ]]; then
            STATUS=blocked
            RETRY_AFTER=''
          elif [[ "$RESOLVE_RESULT" = success && "$PUBLISH_REQUIRED" != true ]]; then
            STATUS=success
            RETRY_AFTER=''
          elif [[ "$RESOLVE_RESULT" = success && "$PREVIEW_RESULT" = success && "$BUILD_RESULT" = success && "$PUBLISH_RESULT" = success ]]; then
            STATUS=success
            RETRY_AFTER=''
          else
            STATUS=failed
            RETRY_AFTER="$(date -u -d '+24 hours' +%Y-%m-%dT%H:%M:%SZ)"
          fi
          TAG="$STATE_TAG"
          if ! gh release view "$TAG" --repo WSL043/DSH-Portable-Updates >/dev/null 2>&1; then
            gh release create "$TAG" --repo WSL043/DSH-Portable-Updates --target main --prerelease \
              --title "Verified DeepSeek Harness qualification state" \
              --notes "Unified single-lane qualification state migrated from the legacy stable and candidate core channels."
          fi
          node update-channel/scripts/update-qualification-state.mjs \
            state/qualification-state.json "$SOURCE_SHA" "$VERSION" "$STATUS" "$ATTEMPTED_AT" "$RETRY_AFTER" "$PIPELINE_SHA" --selection-file state/selection.json
          gh release upload "$TAG" --repo WSL043/DSH-Portable-Updates state/qualification-state.json --clobber
