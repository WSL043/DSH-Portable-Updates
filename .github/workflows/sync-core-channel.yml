name: Sync one verified DSH core channel

on:
  workflow_call:
    inputs:
      channel:
        description: Accepted Portable release channel to resolve and publish
        required: true
        type: string
      rebuild:
        description: Rebuild the accepted core even when its dependency fingerprint is unchanged
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: verified-core-channel-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.source.outputs.publish }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      fingerprint: ${{ steps.source.outputs.fingerprint }}
    steps:
      - name: Resolve the latest accepted DSH-Portable source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            stable) LOCK_FILE=upstream.lock.json ;;
            candidate) LOCK_FILE=upstream.preview.lock.json ;;
            *) echo "Unsupported channel: $CHANNEL" >&2; exit 1 ;;
          esac

          SOURCE_SHA=''
          while IFS= read -r candidate_sha; do
            VERSION="$(curl --fail --silent --show-error --location --retry 3 \
              "https://raw.githubusercontent.com/WSL043/DSH-Portable/$candidate_sha/package.json" | jq -r .version)"
            if { [ "$CHANNEL" = stable ] && [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; } || \
               { [ "$CHANNEL" = candidate ] && [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; }; then
              SOURCE_SHA="$candidate_sha"
              break
            fi
          done < <(gh api \
            'repos/WSL043/DSH-Portable/actions/workflows/ci.yml/runs?status=success&per_page=100' \
            --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | .head_sha')
          test -n "$SOURCE_SHA" && test "$SOURCE_SHA" != null

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/WSL043/DSH-Portable/$SOURCE_SHA/$LOCK_FILE" \
            --output upstream-channel.lock.json
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/WSL043/DSH-Portable/$SOURCE_SHA/app/package-lock.json" \
            --output app-package-lock.json
          FINGERPRINT="$(sha256sum upstream-channel.lock.json app-package-lock.json | sha256sum | cut -d' ' -f1)"

          CURRENT="$(curl --silent --show-error --location \
            "https://github.com/WSL043/DSH-Portable-Updates/releases/download/update-channel-core-$CHANNEL/channel-source.json" \
            2>/dev/null || true)"
          CURRENT_FINGERPRINT="$(printf '%s' "$CURRENT" | jq -r '.fingerprint // empty' 2>/dev/null || true)"

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.rebuild || false }}" != true ] && [ "$FINGERPRINT" = "$CURRENT_FINGERPRINT" ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Verified core is already current at $SOURCE_SHA."
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo "A verified core build is required for $SOURCE_SHA."
          fi

  preview-runtime:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: WSL043/DSH-Portable
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Resolve the locked preview source
        id: preview
        run: |
          node -e "const lock=require('./upstream.preview.lock.json'); console.log('commit='+lock.dsh.reviewedCommit); console.log('packageManager='+lock.dsh.packageManager)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: inputs.channel == 'candidate'
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.preview.outputs.commit }}
          path: upstream
      - name: Build and pack the locked official preview source
        if: inputs.channel == 'candidate'
        run: |
          test "$(git -C upstream rev-parse HEAD)" = '${{ steps.preview.outputs.commit }}'
          npm install --global '${{ steps.preview.outputs.packageManager }}'
          pnpm --dir upstream install --frozen-lockfile
          pnpm --dir upstream run build:official
          pnpm --dir upstream run release:pack --family dsh --out dist/npm --concurrency 8
          pnpm --dir upstream run release:pack --family vendor --out dist/npm-vendor --concurrency 8
          mkdir -p upstream/dist/npm-landlock
          pnpm --dir upstream/native/landlock-run/packages/entry pack --pack-destination "$PWD/upstream/dist/npm-landlock"
      - name: Create a stable-channel marker
        if: inputs.channel == 'stable'
        run: mkdir preview-packed && printf 'stable\n' > preview-packed/STABLE
      - uses: actions/upload-artifact@v7
        with:
          name: preview-packed-${{ inputs.channel }}
          path: |
            upstream/dist/npm
            upstream/dist/npm-vendor
            upstream/dist/npm-landlock
            preview-packed/STABLE
          if-no-files-found: ignore
          compression-level: 0

  build:
    needs: [resolve, preview-runtime]
    if: needs.resolve.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x64
            artifact: windows-x64
          - runner: macos-15
            platform: macos
            arch: arm64
            artifact: macos-arm64
          - runner: macos-15-intel
            platform: macos
            arch: x64
            artifact: macos-x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            artifact: linux-x64
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: WSL043/DSH-Portable
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          name: preview-packed-${{ inputs.channel }}
          path: preview-packed
      - name: Stage the exact verified preview runtime
        if: inputs.channel == 'candidate'
        run: node scripts/stage-preview-runtime.mjs --packed-root preview-packed/upstream/dist --output preview-app
      - uses: dtolnay/rust-toolchain@1.88.0
        if: matrix.platform == 'linux'
        with:
          components: rustfmt
      - name: Install pinned Linux desktop build dependencies
        if: matrix.platform == 'linux'
        run: |
          bash scripts/install-linux-packages.sh \
            build-essential curl file fuse libayatana-appindicator3-dev libfuse2 \
            libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf \
            unzip xauth xvfb xdotool zip
      - name: Build Windows core component
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          if ('${{ inputs.channel }}' -eq 'candidate') {
            ./scripts/build-windows.ps1 -PreviewAppSource preview-app
          } else {
            ./scripts/build-windows.ps1
          }
      - name: Build macOS core component
        if: matrix.platform == 'macos'
        run: |
          if [ '${{ inputs.channel }}' = candidate ]; then
            PREVIEW_APP_SOURCE="$PWD/preview-app" bash scripts/build-macos.sh "${{ matrix.arch }}"
          else
            bash scripts/build-macos.sh "${{ matrix.arch }}"
          fi
      - name: Build Linux core component
        if: matrix.platform == 'linux'
        run: |
          if [ '${{ inputs.channel }}' = candidate ]; then
            PREVIEW_APP_SOURCE="$PWD/preview-app" bash scripts/build-linux.sh "${{ matrix.arch }}"
          else
            bash scripts/build-linux.sh "${{ matrix.arch }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: core-${{ inputs.channel }}-${{ matrix.artifact }}
          path: |
            artifacts/DSH-Portable-update-${{ matrix.artifact }}.zip
            artifacts/dsh-core-update-${{ matrix.artifact }}.json
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: WSL043/DSH-Portable
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          pattern: core-${{ inputs.channel }}-*
          merge-multiple: true
          path: artifacts
      - name: Verify and prepare an atomic channel
        env:
          CHANNEL: ${{ inputs.channel }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          FINGERPRINT: ${{ needs.resolve.outputs.fingerprint }}
        run: |
          set -euo pipefail
          mkdir -p publish previous
          for platform in windows-x64 macos-arm64 macos-x64 linux-x64 linux-arm64; do
            MANIFEST="artifacts/dsh-core-update-${platform}.json"
            ZIP="artifacts/DSH-Portable-update-${platform}.zip"
            node scripts/verify-update-artifact.mjs "$MANIFEST" "$ZIP" engine

            curl --silent --show-error --location \
              "https://github.com/WSL043/DSH-Portable-Updates/releases/download/update-channel-core-$CHANNEL/dsh-core-update-${platform}.json" \
              --output "previous/dsh-core-update-${platform}.json" || true

            HASH="$(sha256sum "$ZIP" | cut -d' ' -f1)"
            VERSION="$(jq -jr '.component.dshVersion' "$MANIFEST" | tr -c 'A-Za-z0-9._-' '-')"
            PUBLISHED_ZIP="DSH-Portable-update-${platform}-${VERSION}-${HASH:0:12}.zip"
            cp "$ZIP" "publish/$PUBLISHED_ZIP"
            URL="https://github.com/WSL043/DSH-Portable-Updates/releases/download/update-channel-core-$CHANNEL/$PUBLISHED_ZIP"
            jq --arg url "$URL" '.component.urls = [$url]' "$MANIFEST" \
              > "publish/dsh-core-update-${platform}.json"
          done
          jq -n \
            --arg channel "$CHANNEL" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg fingerprint "$FINGERPRINT" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:1, channel:$channel, sourceRepository:"WSL043/DSH-Portable", sourceSha:$sourceSha, fingerprint:$fingerprint, publishedAt:$publishedAt}' \
            > publish/channel-source.json
      - name: Publish archives first and manifests last
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="update-channel-core-$CHANNEL"
          gh release view "$TAG" --repo WSL043/DSH-Portable-Updates >/dev/null 2>&1 || \
            gh release create "$TAG" --repo WSL043/DSH-Portable-Updates --target main --prerelease \
              --title "Verified DeepSeek Harness core $CHANNEL channel" \
              --notes "Machine-readable $CHANNEL update assets used by DSH-Portable."
          gh release upload "$TAG" --repo WSL043/DSH-Portable-Updates publish/*.zip --clobber
          gh release upload "$TAG" --repo WSL043/DSH-Portable-Updates publish/dsh-core-update-*.json publish/channel-source.json --clobber
      - name: Keep only the current and immediately previous archives
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KEEP="$(mktemp)"
          find publish -maxdepth 1 -name '*.zip' -printf '%f\n' >> "$KEEP"
          for manifest in previous/*.json; do
            [ -s "$manifest" ] || continue
            jq -r '.component.urls[]? | split("/")[-1]' "$manifest" >> "$KEEP"
          done
          sort -u "$KEEP" -o "$KEEP"
          RELEASE_ID="$(gh api "repos/WSL043/DSH-Portable-Updates/releases/tags/update-channel-core-$CHANNEL" --jq .id)"
          gh api "repos/WSL043/DSH-Portable-Updates/releases/$RELEASE_ID/assets?per_page=100" \
            --paginate --jq '.[] | [.id,.name] | @tsv' | while IFS=$'\t' read -r id name; do
              case "$name" in
                *.zip) grep -Fxq "$name" "$KEEP" || gh api -X DELETE "repos/WSL043/DSH-Portable-Updates/releases/assets/$id" ;;
              esac
            done
