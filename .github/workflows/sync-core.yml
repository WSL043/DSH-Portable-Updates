name: Sync verified DSH core

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      remaining:
        description: Additional bounded fallback runs after this one (0 to 2)
        required: false
        type: number
        default: 2
      accepted_only:
        description: Requalify the already accepted core for the latest verified Native shell without discovering a new upstream version
        required: false
        type: boolean
        default: false
      rebuild:
        description: Rebuild the accepted core even when its dependency fingerprint is unchanged
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: core-sync-queue
  cancel-in-progress: false

jobs:
  core:
    uses: ./.github/workflows/sync-core-channel.yml
    with:
      accepted_only: ${{ inputs.accepted_only || false }}
      rebuild: ${{ inputs.rebuild || false }}
    secrets: inherit

  drain-queue:
    needs: [core]
    if: >-
      always() && !cancelled() && !inputs.accepted_only && !inputs.rebuild &&
      needs.core.outputs.attempted == 'true' &&
      (github.event_name == 'schedule' || inputs.remaining > 0)
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Continue the bounded qualification queue after recording this result
        env:
          GH_TOKEN: ${{ github.token }}
          REMAINING: ${{ github.event_name == 'schedule' && 2 || inputs.remaining }}
        run: |
          set -euo pipefail
          [[ "$REMAINING" =~ ^[1-2]$ ]] || { echo 'Invalid queue budget'; exit 1; }
          gh workflow run sync-core.yml --repo "$GITHUB_REPOSITORY" --ref main -f remaining="$((REMAINING - 1))"
