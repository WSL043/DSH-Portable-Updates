name: Sync verified DSH core

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-core*.yml
      - scripts/apply-released-client-adapters.mjs
      - scripts/preflight-adapters.mjs
      - scripts/historical-core-policy.mjs
      - scripts/verify-descriptor-v2-migration.mjs
      - scripts/discover-core-source.mjs
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      remaining:
        description: Additional bounded fallback runs after this one (0 to 4)
        required: false
        type: number
        default: 4
      accepted_only:
        description: Requalify the already accepted core for the latest verified Native shell without discovering a new upstream version
        required: false
        type: boolean
        default: false
      rebuild:
        description: Rebuild the accepted core even when its dependency fingerprint is unchanged
        required: false
        type: boolean
        default: false
      rebuild_version:
        description: Optional exact already-qualified core to refresh (requires rebuild=true)
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: write

concurrency:
  group: core-sync-queue
  cancel-in-progress: false

jobs:
  core:
    uses: ./.github/workflows/sync-core-channel.yml
    with:
      accepted_only: ${{ inputs.accepted_only || false }}
      rebuild: ${{ inputs.rebuild || false }}
      rebuild_version: ${{ inputs.rebuild_version || '' }}
    secrets: inherit

  drain-queue:
    needs: [core]
    if: >-
      always() && !cancelled() && !inputs.accepted_only && !inputs.rebuild &&
      needs.core.outputs.attempted == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.remaining > 0)
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Continue the bounded qualification queue after recording this result
        env:
          GH_TOKEN: ${{ github.token }}
          REMAINING: ${{ github.event_name != 'workflow_dispatch' && 4 || inputs.remaining }}
        run: |
          set -euo pipefail
          [[ "$REMAINING" =~ ^[1-4]$ ]] || { echo 'Invalid queue budget'; exit 1; }
          gh workflow run sync-core.yml --repo "$GITHUB_REPOSITORY" --ref main -f remaining="$((REMAINING - 1))"
