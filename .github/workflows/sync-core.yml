name: Sync verified DSH core

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild both accepted channels even when their dependency fingerprints are unchanged
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  stable:
    uses: ./.github/workflows/sync-core-channel.yml
    with:
      channel: stable
      rebuild: ${{ inputs.rebuild || false }}
    secrets: inherit

  candidate:
    uses: ./.github/workflows/sync-core-channel.yml
    with:
      channel: candidate
      rebuild: ${{ inputs.rebuild || false }}
    secrets: inherit
